# What Raccy says, in English. The same keys are in cs.toml, in Czech.
#
# How to edit
# - A key holds one line, or a list of variants in [ ]. Raccy picks one of
#   the variants each time, so he does not repeat himself. Add and remove
#   variants freely; just keep at least one.
# - {word} is a placeholder Raccy fills in. The comment above each section
#   says which placeholders it has. Use only those: a typo, an unknown
#   placeholder, or a key missing from one language fails `cargo test`.
# - Keys .one and .many are the forms for a count: 1, and more. {n} is the
#   number. Czech also has .few, for 2 to 4.
# - The voice: sentences start with a capital and end with a mark, no emoji,
#   no em dashes, a street hustler's English.
#
# Placeholders that come up often
#   {who}    a program, like msedge; with no name, "a system process"
#   {dest}   where a connection goes: a name or address, marked on the LAN
#   {what}   the kind of connection, see [kind]
#   {port}   a port number
#   {rate}   a rate, like 2.1 MB/s
#   {app}    the program taking the whole screen
#   {ssid}   a Wi-Fi name

# ---------------------------------------------------------------- words

[words]
# Stands in for a destination Raccy will not name (banks, health).
hidden = "somewhere private"
# A program whose name Windows keeps back.
system_process = "a system process"
# The fullscreen program, when it has no name.
something = "something"
# Stands in for a destination that is one of this computer's own addresses.
this_pc = "this pc"
# {name} a machine's address or name on the local network
on_lan = "{name} on the LAN"
# {name} a machine's name, {ip} its address
named = "{name} ({ip})"
# {ip} an address, {mac} the hardware address
unnamed = "{ip}, mac {mac}"

# The very first run: five lines, each 30 characters at most.
intro = "Hi, I'm Raccy. I eat packets\nEverything stays on this pc\nNothing about you goes out\nNo snitch, just a lookout\nRight click menu, left scratch"


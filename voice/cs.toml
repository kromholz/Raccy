# Jak s tím zacházet
# - Klíč má buď jednu hlášku, nebo seznam variant v [ ]. Z variant si
#   pokaždé vybere jednu, ať nemluví pořád stejně.
# - {slovo} je proměnná, kterou Raccy doplní. Nad každou sekcí je napsané,
#   které proměnné tam jsou.
# - Věty začínaj velkým písmenem a končej tečkou, otazníkem nebo vykřičníkem.
#   Hláška, co začíná proměnnou, se píše proměnnou; velký písmeno tam doplní
#   program, až to Raccy řekne.

# Proměnné, co se opakujou
#   {who}    program, třeba msedge; bez jména „systémovej proces“
#   {dest}   kam spojení vede: jméno nebo adresa, v lanu s dovětkem z [words]
#   {what}   druh spojení, viz [kind]
#   {port}   číslo portu
#   {rate}   rychlost, třeba 2.1 MB/s
#   {app}    program, co jede přes celou obrazovku
#   {ssid}   jméno wifi

# ---------------------------------------------------------------- slova

[words]
# Místo cíle, který Raccy nejmenuje (banky, zdraví).
hidden = "někam soukromě"
# Program, jehož jméno Windows neprozradí.
system_process = "systémovej proces"
# Program přes celou obrazovku, když nemá jméno.
something = "něco"
# Místo cíle, když spojení vede na vlastní adresu tohohle počítače.
this_pc = "tenhle počítač"
# {name} adresa nebo jméno stroje v místní síti
on_lan = "{name} v lanu"
# {name} jméno stroje, {ip} jeho adresa
named = "{name} ({ip})"
# {ip} adresa, {mac} fyzická adresa
unnamed = "{ip}, mac {mac}"

# Úplně první spuštění: pět řádků, každý nejvýš 30 znaků.
intro = "Čau, sem Raccy. Žeru pakety\nVšechno zůstává u tebe\nNic o tobě nikam neposílám\nNejsem práskač, jen hlídám\nMenu pravým, drbání levým"


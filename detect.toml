# What Raccy recognises on the wire: well-known services by the domains they
# use and the programs that are theirs, names that are private, and the lists
# the watch works from. Built into the program like voice/ and tuning.toml:
# change a list, `cargo build`. `cargo test` fails on a service name that does
# not exist, a domain or program listed twice, and a service with no voice.
#
# Domains match whole labels from the end, the longest first: drive.google.com
# is GoogleDrive although google.com is Google, and notgithub.com is not GitHub.
# Programs match the executable's name without .exe, in lowercase. A service's
# name is its name in the [service] section of the voice files.

# Words that mark a name private wherever they appear in it: never named.
private_words = ["bank", "banka", "pojistovna", "porn", "xxx", "onlyfans", "tinder", "badoo", "seznamka"]
# Words in a name that give away a call home: telemetry, crash reports, usage analytics.
calls_home_words = ["telemetry", "analytics", "metrics", "crashlytics", "crash-report", "sentry", "bugsnag", "appcenter", "app-measurement", "tracking", "beacons"]

# Plain http that is plain on purpose: revocation lists and OCSP from the
# certificate authorities, and Windows checking connectivity and updates.
[plain_http]
# Names starting with these labels.
labels = ["ocsp.", "ocsp2.", "crl.", "crl3.", "crl4."]
# Names ending in these domains.
suffixes = ["microsoft.com", "windowsupdate.com", "msftconnecttest.com", "msftncsi.com", "digicert.com", "lencr.org", "sectigo.com", "usertrust.com", "comodoca.com", "globalsign.com", "globalsign.net", "entrust.net", "identrust.com", "pki.goog", "amazontrust.com", "godaddy.com", "verisign.com"]

[watch]
# System tools that rarely have business on the internet: a warning.
system_tools = ["rundll32", "regsvr32", "mshta", "certutil", "bitsadmin", "wscript", "cscript", "msbuild", "installutil", "regasm", "regsvcs", "cmstp", "calc"]
# Shells go online for plenty of honest reasons, but it is still worth a word.
shells = ["powershell", "pwsh", "cmd"]
# Top-level domains that cost next to nothing, where scams like to live.
cheap_tlds = ["xyz", "top", "zip", "mov", "click", "icu", "buzz", "rest", "cfd", "sbs", "cyou", "monster"]
# Programs whose job is to speak DNS to outside resolvers ("" is the system itself).
resolvers = ["", "windows", "svchost", "dnscache", "nordvpn-service", "tailscaled"]
# The system's own network chatter, whose plain http is the operating system
# checking itself ("" is the system itself, when it would not say which program).
system_itself = ["windows", "svchost", "networkmanager", "gnome-shell", "nm-online", "systemd-resolved", "connman", "ubuntu-advantage"]
# Mining pools: ports and words in their names.
mining_ports = [3333, 14433, 14444, 45700]
mining_words = ["nicehash", "xmrpool", "minexmr", "moneroocean", "supportxmr", "2miners", "f2pool", "ethermine", "unmineable", "nanopool"]
# Tor relays and directories.
tor_ports = [9001, 9030]

# What kind of program a window he sits on belongs to, in lowercase; the kinds'
# lines are [sits_on] in the voice files. Any other program gets his plain lines
# about sitting down.
#
# Each system calls a window by a different name, so all three spellings belong
# in the same list: Windows gives the executable without .exe, a Mac gives the
# application's name as a person reads it, and Wayland gives the app id.
[seat]
Browser = ["msedge", "chrome", "firefox", "opera", "brave", "vivaldi", "arc", "librewolf", "zen", "waterfox", "safari", "google chrome", "microsoft edge", "orion", "org.mozilla.firefox", "chromium", "chromium-browser", "epiphany"]
Code = ["code", "cursor", "windsurf", "devenv", "idea64", "rider64", "pycharm64", "clion64", "webstorm64", "rustrover64", "goland64", "zed", "sublime_text", "notepad++", "nvim-qt", "xcode", "visual studio code", "sublime text", "neovide", "org.gnome.builder", "jetbrains-idea", "jetbrains-rustrover"]
Terminal = ["windowsterminal", "wezterm-gui", "alacritty", "cmd", "powershell", "pwsh", "conhost", "mintty", "terminal", "iterm2", "ghostty", "kitty", "wezterm", "warp", "tabby", "gnome-terminal", "org.gnome.console", "konsole", "foot", "xterm", "org.wezfurlong.wezterm", "com.mitchellh.ghostty"]
Chat = ["discord", "slack", "ms-teams", "teams", "telegram", "signal", "whatsapp", "element", "claude", "chatgpt", "messages", "microsoft teams", "zoom.us", "org.telegram.desktop", "signal-desktop"]
Mail = ["outlook", "olk", "thunderbird", "mailspring", "mail", "microsoft outlook", "mimestream", "spark", "org.gnome.evolution", "geary"]
Office = ["winword", "excel", "powerpnt", "onenote", "soffice", "notion", "obsidian", "pages", "numbers", "keynote", "microsoft word", "microsoft excel", "microsoft powerpoint", "libreoffice", "libreoffice-writer", "libreoffice-calc", "preview"]
Media = ["vlc", "mpc-hc64", "mpc-be64", "spotify", "potplayermini64", "obs64", "audacity", "iina", "music", "tv", "quicktime player", "obs", "mpv", "org.gnome.totem", "rhythmbox"]
Games = ["steam", "steamwebhelper", "epicgameslauncher", "battle.net", "riotclientux", "galaxyclient", "playnite.desktopapp", "heroic", "lutris"]
Files = ["explorer", "totalcmd64", "doublecmd", "finder", "nautilus", "org.gnome.nautilus", "dolphin", "thunar", "nemo", "pcmanfm"]
Design = ["photoshop", "illustrator", "figma", "blender", "krita", "inkscape", "aseprite", "sketch", "affinity photo", "affinity designer", "pixelmator pro", "org.inkscape.inkscape", "gimp"]


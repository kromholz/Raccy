[package]
name = "raccy"
version = "0.3.0"
edition = "2024"
description = "A techy raccoon that lives on your desktop and feeds on your network traffic"

[dependencies]
fontdue = "0.9"
qrcodegen = "1.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSDictionary", "NSEnumerator", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSRunLoop", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSColor",
    "NSDragging",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGGeometry", "CGImage", "CGWindow", "CGWindowLevel"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation"] }

[build-dependencies]
embed-resource = "3"

[features]
# Timing log for live diagnosis; never in a normal build.
trace = []

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
rqrr = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
